<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Telekom CEP — How we rebuilt Browse Catalog</title>
<meta name="description" content="Run 2 of the workshop: the same skills chain pointed at a screen that already existed — the research, the cut, the two builds, and a live side-by-side comparison of all three catalogs." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* Tokens duplicated from deck.css so the shell stands alone. */
  :root{
    --magenta:#e50075; --brand:#f05c62; --ink:#131318; --paper:#fff;
    --surface:#f4f4f4; --page:#faf9f8; --chrome:#f0f0f0;
    --secondary-text:rgba(0,0,0,.6); --rail-line:#d8d8d8;
    --line:rgba(19,19,24,.12); --line-soft:rgba(19,19,24,.07); --faint:rgba(0,0,0,.42);
    --magenta-wash:rgba(229,0,117,.07); --magenta-line:rgba(229,0,117,.28);
    --gradient-primary:linear-gradient(-90deg,#f05c62 0%,#e50075 100%);
    --radius-btn:8px; --radius-card:12px;
    --shadow-tiny-btn:0px 2px 4px rgba(34,33,46,.12);
    --ease:cubic-bezier(.24,.48,0,.98);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:Montserrat,'Helvetica Neue',Helvetica,Arial,sans-serif;
    color:var(--secondary-text); background:var(--chrome);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ══ header: main nav + contextual sub-nav ══ */
  header.bar{
    flex-shrink:0; z-index:10; background:rgba(255,255,255,.92);
    backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line-soft);
  }

  .nav{height:60px;display:flex;align-items:center;gap:14px;padding:0 18px;}

  /* brand — the gradient tile idiom from WorkspaceHeader */
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .brand .tile{
    width:26px;height:26px;border-radius:7px;background:var(--gradient-primary);
    display:grid;place-items:center;flex:none;
  }
  .brand .tile svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.9;}
  .brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:-.01em;}
  .brand .txt{font-size:12.5px;color:var(--faint);letter-spacing:.09em;text-transform:uppercase;font-weight:600;}

  /* ══ run switcher — Run 1 lives one folder up ══ */
  .runs{
    display:flex;gap:3px;background:var(--chrome);border:1px solid var(--line-soft);
    border-radius:999px;padding:3px;flex-shrink:0;
  }
  .runs a,.runs span{
    font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;white-space:nowrap;
    text-decoration:none;color:var(--secondary-text);transition:all .25s var(--ease);
    display:flex;align-items:center;gap:6px;
  }
  .runs a:hover{color:var(--ink);background:var(--paper);}
  .runs .on{background:var(--gradient-primary);color:#fff;}
  .runs .r{font-variant-numeric:tabular-nums;opacity:.55;font-weight:700;}
  .runs .on .r{opacity:.7;}

  .tabs{
    display:flex;gap:4px;background:var(--chrome);border:1px solid var(--line-soft);
    border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    border:none;background:transparent;font:inherit;font-size:13.5px;font-weight:600;color:var(--secondary-text);
    padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:8px;flex-shrink:0;
    transition:background .25s var(--ease),color .25s var(--ease);
  }
  .tab .n{font-variant-numeric:tabular-nums;opacity:.5;font-weight:700;font-size:11.5px;}
  .tab .em{color:var(--faint);font-weight:500;}
  .tab:hover{color:var(--ink);}
  .tab.on{background:var(--ink);color:#fff;}
  .tab.on .n{opacity:.6;} .tab.on .em{color:rgba(255,255,255,.62);}
  .tab .live{
    width:7px;height:7px;border-radius:50%;background:var(--magenta);flex:none;
    box-shadow:0 0 0 3px var(--magenta-wash);
  }
  .tab.on .live{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22);}

  .right{margin-inline-start:auto;display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .hint{font-size:12.5px;color:var(--faint);white-space:nowrap;}
  .hint b{color:var(--secondary-text);font-weight:600;}
  .open{
    display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink);
    text-decoration:none;border:1px solid var(--line);background:var(--paper);
    border-radius:var(--radius-btn);padding:9px 13px;box-shadow:var(--shadow-tiny-btn);
    transition:all .25s var(--ease);white-space:nowrap;
  }
  .open:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  .open svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;}

  /* ══ contextual sub-nav ══ */
  .subnav{
    display:none;align-items:center;gap:14px;padding:10px 18px;
    border-top:1px solid var(--line-soft);background:var(--page);
    overflow-x:auto;scrollbar-width:none;
  }
  .subnav::-webkit-scrollbar{display:none;}
  .subnav.show{display:flex;}
  .crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint);flex-shrink:0;white-space:nowrap;}
  .crumb svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:1.8;}
  .crumb b{color:var(--ink);font-weight:600;}
  .subtabs{display:flex;gap:6px;flex-shrink:0;}
  .subtab{
    border:1px solid var(--line);background:var(--paper);font:inherit;font-size:12.5px;font-weight:600;
    color:var(--secondary-text);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:7px;flex-shrink:0;transition:all .22s var(--ease);
  }
  .subtab .sw{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .subtab .bk{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;display:none;}
  .subtab:hover{border-color:var(--rail-line);color:var(--ink);}
  .subtab.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .subtab.home.on .bk{display:inline-block;}
  .subtab.home.on .ico{display:none;}
  .sublabel{font-size:12px;color:var(--faint);flex-shrink:0;white-space:nowrap;margin-inline-start:2px;}

  /* ══ stage ══ */
  .stage{flex:1;position:relative;min-height:0;background:var(--page);}
  .stage iframe{width:100%;height:100%;border:0;display:block;}
  .loader{
    position:absolute;inset:0;display:grid;place-items:center;grid-auto-flow:column;
    background:var(--page);color:var(--faint);font-size:13.5px;pointer-events:none;
    opacity:0;transition:opacity .3s;
  }
  .loader.show{opacity:1;}
  .loader .spin{
    width:22px;height:22px;border-radius:50%;
    border:2.5px solid var(--line-soft);border-top-color:var(--magenta);
    animation:spin .8s linear infinite;margin-inline-end:11px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media(max-width:1420px){ .hint{display:none;} .runs a,.runs span{padding:7px 10px;} }
  @media(max-width:1180px){ .runs .lbl{display:none;} }
  @media(max-width:820px){
    .brand .txt{display:none;}
    .open .lbl{display:none;} .open{padding:9px 11px;}
    .tab{padding:8px 11px;font-size:12.5px;} .tab .n{display:none;} .tab .em{display:none;}
    .sublabel{display:none;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<header class="bar">
  <nav class="nav">
    <div class="brand">
      <span class="tile" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M9 20V9" stroke-linecap="round"/></svg>
      </span>
      <b>Telekom&nbsp;CEP</b>
      <span class="txt">· Browse Catalog</span>
    </div>

    <div class="runs" aria-label="Which run">
      <a href="../index.html"><span class="r">Run 1</span><span class="lbl">Create Customer</span></a>
      <span class="on" aria-current="page"><span class="r">Run 2</span><span class="lbl">Browse Catalog</span></span>
    </div>

    <div class="tabs" role="tablist" aria-label="Stages">
      <button class="tab" role="tab" data-key="problem">
        <span class="n">01</span><span>Problem <span class="em">· the dead screen</span></span>
      </button>
      <button class="tab" role="tab" data-key="research">
        <span class="n">02</span><span>Research <span class="em">· Mobbin</span></span>
      </button>
      <button class="tab" role="tab" data-key="spec">
        <span class="n">03</span><span>Spec <span class="em">· the cut</span></span>
      </button>
      <button class="tab" role="tab" data-key="design">
        <span class="n">04</span><span>Design <span class="em">· two builds</span></span>
      </button>
      <button class="tab" role="tab" data-key="comparison">
        <span class="live" aria-hidden="true"></span><span>Comparison <span class="em">· live</span></span>
      </button>
      <button class="tab" role="tab" data-key="insights">
        <span class="n">05</span><span>Insights</span>
      </button>
    </div>

    <div class="right">
      <span class="hint" id="hint">Click the deck, then use <b>← →</b></span>
      <a class="open" id="openBtn" href="01-problem.html" target="_blank" rel="noopener">
        <span class="lbl">Open full screen</span>
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </nav>

  <div class="subnav" id="subnav" role="tablist" aria-label="View">
    <span class="crumb">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <b id="crumbCtx">Research</b>
    </span>
    <div class="subtabs" id="subtabs"></div>
    <span class="sublabel" id="sublabel"></span>
  </div>
</header>

<div class="stage">
  <div class="loader show" id="loader"><span class="spin"></span> Loading…</div>
  <iframe id="frame" title="Presentation" src="01-problem.html"></iframe>
</div>

<script>
(function(){
  var ARROWS = 'Click the deck, then use <b>&larr; &rarr;</b>';
  var LIVEHINT = 'The framed pages are <b>live</b> — scroll and click inside them';

  var SECTIONS = {
    problem:    {label:'Problem · the dead screen', deck:'01-problem.html',    hint:ARROWS},
    research:   {label:'Research · Mobbin',         deck:'02-research.html',   hint:ARROWS, subs:[
      {key:'deck', label:'Research deck',     page:'02-research.html',   dot:null},
      {key:'wall', label:'All 16 references', page:'02-references.html', dot:'var(--magenta)'}
    ]},
    spec:       {label:'Spec · the cut',            deck:'03-spec.html',       hint:ARROWS},
    design:     {label:'Design · two builds',       deck:'04-design.html',     hint:ARROWS},
    comparison: {label:'Comparison · live',         deck:'05-comparison.html', hint:LIVEHINT},
    insights:   {label:'Insights',                  deck:'06-insights.html',   hint:ARROWS}
  };

  var tabs = [].slice.call(document.querySelectorAll('.tab'));
  var frame = document.getElementById('frame'), loader = document.getElementById('loader');
  var openBtn = document.getElementById('openBtn'), hint = document.getElementById('hint');
  var subnav = document.getElementById('subnav'), subtabs = document.getElementById('subtabs');
  var crumbCtx = document.getElementById('crumbCtx'), sublabel = document.getElementById('sublabel');

  var curKey = null, curSub = 'deck';

  function load(page){
    if(frame.getAttribute('src') !== page){ loader.classList.add('show'); frame.setAttribute('src', page); }
    openBtn.setAttribute('href', page);
  }

  function renderSubs(sec){
    subtabs.innerHTML = '';
    sec.subs.forEach(function(s, idx){
      var b = document.createElement('button');
      b.className = 'subtab' + (idx === 0 ? ' home' : '');
      b.setAttribute('role','tab');
      b.dataset.sub = s.key;
      var inner = '';
      if(idx === 0){
        inner = '<svg class="bk" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
              + '<svg class="ico" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8" stroke-linecap="round"/></svg>';
      } else if(s.dot){
        inner = '<span class="sw" style="background:' + s.dot + '"></span>';
      }
      b.innerHTML = inner + '<span>' + s.label + '</span>';
      b.addEventListener('click', function(){ go(curKey, s.key, true); });
      subtabs.appendChild(b);
    });
  }

  function go(key, sub){
    var sec = SECTIONS[key];
    if(!sec){ key = 'problem'; sec = SECTIONS.problem; }
    var switched = key !== curKey;
    curKey = key;
    curSub = sec.subs ? (sub || 'deck') : 'deck';

    tabs.forEach(function(t){
      var on = t.dataset.key === key;
      t.classList.toggle('on', on);
      t.setAttribute('aria-selected', on);
    });
    hint.innerHTML = sec.hint;

    if(sec.subs){
      if(switched) renderSubs(sec);
      crumbCtx.textContent = sec.label;
      subnav.classList.add('show');
      var active = sec.subs.filter(function(s){ return s.key === curSub; })[0] || sec.subs[0];
      [].forEach.call(subtabs.children, function(b){
        var on = b.dataset.sub === curSub;
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', on);
      });
      sublabel.textContent = curSub === 'deck'
        ? 'Or open the full reference wall — every screen we pulled'
        : 'Every Mobbin reference, with its link — tap Research deck to go back';
      load(active.page);
      document.title = 'Telekom CEP — ' + sec.label + (curSub === 'deck' ? '' : ' · ' + active.label);
    } else {
      subnav.classList.remove('show');
      load(sec.deck);
      document.title = 'Telekom CEP — ' + sec.label;
    }

    var hash = (curSub && curSub !== 'deck') ? key + '-' + curSub : key;
    if(location.hash.slice(1) !== hash) history.replaceState(null, '', '#' + hash);
  }

  tabs.forEach(function(t){ t.addEventListener('click', function(){ go(t.dataset.key, 'deck'); }); });
  frame.addEventListener('load', function(){ loader.classList.remove('show'); });

  /* Arrow keys typed while the shell (not the iframe) has focus still drive the deck. */
  document.addEventListener('keydown', function(e){
    if(['ArrowRight','ArrowLeft',' ','PageUp','PageDown'].indexOf(e.key) === -1) return;
    if(document.activeElement === frame) return;
    try { frame.contentWindow.postMessage({deck:'key', key:e.key}, '*'); } catch(err){}
  });

  function parseHash(){
    var raw = location.hash.slice(1);
    if(!raw) return null;
    var dash = raw.indexOf('-');
    if(dash > -1) return {key:raw.slice(0, dash), sub:raw.slice(dash + 1)};
    return {key:raw, sub:'deck'};
  }

  var init = parseHash();
  if(init && SECTIONS[init.key]) go(init.key, init.sub); else go('problem', 'deck');
  window.addEventListener('hashchange', function(){
    var h = parseHash();
    if(h && SECTIONS[h.key]) go(h.key, h.sub);
  });
})();
</script>
</body>
</html>
